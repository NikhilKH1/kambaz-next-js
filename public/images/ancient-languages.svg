<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="#f5f5dc"/>
  <g transform="translate(150,100)">
    <!-- Ancient scroll -->
    <rect x="-60" y="-50" width="120" height="100" rx="5" fill="url(#langGrad)" stroke="#654321" stroke-width="2"/>
    <!-- Scroll edges -->
    <rect x="-70" y="-40" width="10" height="80" rx="5" fill="#8b4513"/>
    <rect x="60" y="-40" width="10" height="80" rx="5" fill="#8b4513"/>
    <!-- Ancient text/symbols -->
    <text x="0" y="-20" text-anchor="middle" fill="#f5f5dc" font-family="serif" font-size="16">ᚠᚢᚦᚨᚱᚲ</text>
    <text x="0" y="0" text-anchor="middle" fill="#f5f5dc" font-family="serif" font-size="14">Sindarin</text>
    <text x="0" y="15" text-anchor="middle" fill="#f5f5dc" font-family="serif" font-size="14">Quenya</text>
    <text x="0" y="30" text-anchor="middle" fill="#f5f5dc" font-family="serif" font-size="12">Khuzdul</text>
    <!-- Runes around the scroll -->
    <text x="-100" y="-30" fill="#8b4513" font-family="serif" font-size="20">ᚱ</text>
    <text x="100" y="-30" fill="#8b4513" font-family="serif" font-size="20">ᚢ</text>
    <text x="-100" y="30" fill="#8b4513" font-family="serif" font-size="20">ᚾ</text>
    <text x="100" y="30" fill="#8b4513" font-family="serif" font-size="20">ᛖ</text>
    <!-- Decorative border -->
    <circle cx="-40" cy="-30" r="3" fill="#f5f5dc"/>
    <circle cx="40" cy="-30" r="3" fill="#f5f5dc"/>
    <circle cx="-40" cy="30" r="3" fill="#f5f5dc"/>
    <circle cx="40" cy="30" r="3" fill="#f5f5dc"/>
  </g>
  <text x="150" y="180" text-anchor="middle" fill="#8b4513" font-family="Arial" font-size="16" font-weight="bold">ANCIENT LANGUAGES</text>
</svg>

