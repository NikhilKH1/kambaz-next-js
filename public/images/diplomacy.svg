<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diplomacyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="#e8f5e8"/>
  <g transform="translate(150,100)">
    <!-- Council table -->
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="url(#diplomacyGrad)"/>
    <!-- Chairs around table -->
    <rect x="-80" y="-15" width="15" height="30" rx="3" fill="#4caf50"/>
    <rect x="65" y="-15" width="15" height="30" rx="3" fill="#4caf50"/>
    <rect x="-15" y="-50" width="30" height="15" rx="3" fill="#4caf50"/>
    <rect x="-15" y="35" width="30" height="15" rx="3" fill="#4caf50"/>
    <!-- Representatives -->
    <circle cx="-80" cy="-25" r="8" fill="#ffd54f"/>
    <circle cx="65" cy="-25" r="8" fill="#ffd54f"/>
    <circle cx="0" cy="-40" r="8" fill="#ffd54f"/>
    <circle cx="0" cy="40" r="8" fill="#ffd54f"/>
    <!-- Crowns/hats -->
    <polygon points="-80,-35 -75,-40 -70,-35" fill="#ffd700"/>
    <polygon points="65,-35 70,-40 75,-35" fill="#ffd700"/>
    <polygon points="-5,-50 0,-55 5,-50" fill="#ffd700"/>
    <polygon points="-5,30 0,25 5,30" fill="#ffd700"/>
    <!-- Peace symbols -->
    <circle cx="-50" cy="-60" r="8" fill="none" stroke="#2e7d32" stroke-width="2"/>
    <path d="M-50,-68 L-50,-52 M-58,-60 L-42,-60" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="50" cy="-60" r="8" fill="none" stroke="#2e7d32" stroke-width="2"/>
    <path d="M50,-68 L50,-52 M42,-60 L58,-60" stroke="#2e7d32" stroke-width="2"/>
  </g>
  <text x="150" y="180" text-anchor="middle" fill="#2e7d32" font-family="Arial" font-size="16" font-weight="bold">INTER-SPECIES DIPLOMACY</text>
</svg>

